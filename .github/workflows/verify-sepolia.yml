name: Verify MiniVault on Sepolia

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-minivault-sepolia
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployed MiniVault source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.9.0

      - name: Install the exact deployment dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@cab19933c33c2ad1d4c7a84864a3601dddfd16f3 --no-commit
          forge install foundry-rs/forge-std@f3dae6e6ee381f25eb6a246f7da9b85c91a68219 --no-commit

      - name: Confirm Sepolia RPC
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SEPOLIA_RPC_URL}" ]; then
            echo "::error::Missing repository secret SEPOLIA_RPC_URL"
            exit 1
          fi
          CHAIN_ID="$(cast chain-id --rpc-url "${SEPOLIA_RPC_URL}")"
          test "${CHAIN_ID}" = "11155111"

      - name: Build with deployment compiler settings
        run: forge build

      - name: Submit source verification to Blockscout
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          set -euo pipefail
          forge verify-contract \
            0x601491dace86294f9dfc3adcff3c739ae5aa4a1c \
            contracts/MiniVault.sol:MiniVault \
            --rpc-url "${SEPOLIA_RPC_URL}" \
            --chain-id 11155111 \
            --verifier blockscout \
            --verifier-url https://eth-sepolia.blockscout.com/api? \
            --compiler-version v0.8.24+commit.e11b9ed9 \
            --watch
