name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify contract address configuration
        env:
          VITE_VAULT_ADDRESS: ${{ vars.VITE_VAULT_ADDRESS }}
        run: |
          if [[ ! "$VITE_VAULT_ADDRESS" =~ ^0x[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Set the repository Actions variable VITE_VAULT_ADDRESS to the deployed Sepolia contract address."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_VAULT_ADDRESS: ${{ vars.VITE_VAULT_ADDRESS }}
          VITE_SEPOLIA_CHAIN_ID: "11155111"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
